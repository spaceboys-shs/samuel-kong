<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Kong</title>
    <style>
        /* Color Variables - Blue Theme */
        :root {
            --bg-color: #ffffff;
            --text-main: #1e3a8a; /* Dark blue for the main title */
            --text-title: #2563eb; /* Bright blue for card titles */
            --text-desc: #60a5fa; /* Light blue for description text */
            --card-bg: #ffffff;
            --shadow-color: rgba(37, 99, 235, 0.1);
            --shadow-hover: rgba(37, 99, 235, 0.25);
        }

        /* Base Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Main Title Styles */
        h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 4rem;
            text-align: center;
            animation: fadeInDown 0.8s ease-out;
        }

        /* Projects Container */
        .projects-container {
            display: flex;
            gap: 3rem;
            max-width: 900px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap; /* Automatically wrap on smaller screens */
        }

        /* Floating Card Styles */
        .card {
            background-color: var(--card-bg);
            text-decoration: none; /* Remove underline from links */
            border-radius: 24px;
            padding: 3rem 2rem;
            flex: 1;
            min-width: 280px;
            max-width: 400px;
            text-align: center;
            /* Initial shadow for floating effect */
            box-shadow: 0 15px 35px var(--shadow-color);
            border: 1px solid rgba(37, 99, 235, 0.05);
            /* Smooth transition animation */
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeInUp 0.8s ease-out backwards;
        }

        /* Staggered entrance animation for cards */
        .card:nth-child(1) { animation-delay: 0.2s; }
        .card:nth-child(2) { animation-delay: 0.4s; }

        /* Hover: Float up and deepen shadow */
        .card:hover {
            transform: translateY(-15px);
            box-shadow: 0 30px 60px var(--shadow-hover);
        }

        /* Card Text Styles */
        .card h2 {
            color: var(--text-title);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .card p {
            color: var(--text-desc);
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 500;
        }

        /* Simple Entrance Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            h1 { font-size: 3rem; margin-bottom: 3rem; }
            .projects-container { gap: 2rem; }
            .card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Main Title -->
    <h1>Samuel Kong</h1>

    <!-- Cards Container -->
    <div class="projects-container">
        
        <!-- Card 1: Countdown App -->
        <a href="/countdown.html" class="card">
            <h2>Timeline & Countdown</h2>
            <p>A precision countdown web app based on Malaysia (GMT+8) time zone with Firebase Auth.</p>
        </a>

        <!-- Card 2: Number Guessing Game -->
        <a href="/guess-a-number.html" class="card">
            <h2>Number Guessing</h2>
            <p>A fun and interactive mini-game. Test your luck and guess the hidden number from 0 to 100.</p>
        </a>

    </div>

</body>
</html>
